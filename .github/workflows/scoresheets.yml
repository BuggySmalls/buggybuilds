name: Fetch scoresheets
# Copies every approved scoresheet photo for a night onto the `scoresheets` branch
# (scoresheets/<date>/lane<L>-game<G>.jpg + sheets.json) so Claude can read them and log the scores.
on:
  workflow_dispatch:
    inputs:
      date:
        description: League night (YYYY-MM-DD)
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - env:
          DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 CerealBowlersAdmin"
          git fetch origin scoresheets --depth=1 && git checkout -B scoresheets FETCH_HEAD || git checkout --orphan scoresheets
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name scoresheets -exec rm -rf {} +
          mkdir -p "scoresheets/$DATE"
          curl -sS -A "$UA" https://cerealbowlers.org/api/games \
            | jq --arg d "$DATE" '[.sheets[] | select(.date == $d and .status == "approved")]' > "scoresheets/$DATE/sheets.json"
          for row in $(jq -r '.[] | "\(.id):\(.lane):\(.game)"' "scoresheets/$DATE/sheets.json"); do
            IFS=: read -r id lane game <<< "$row"
            curl -sS -A "$UA" -o "scoresheets/$DATE/lane${lane}-game${game}.jpg" "https://cerealbowlers.org/api/sheet/${id}.jpg"
          done
          echo "::notice title=scoresheets::$(jq -c 'map({lane,game,pids})' "scoresheets/$DATE/sheets.json")"
          git config user.name "cerealbowlers-bot"; git config user.email "bot@users.noreply.github.com"
          git add scoresheets
          git commit -qm "Scoresheets for $DATE" || echo "nothing new"
          git push -q origin scoresheets
